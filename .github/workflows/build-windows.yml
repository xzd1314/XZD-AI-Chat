name: Build Windows Exe

on:
  push:
    branches: [winui3-port]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          dotnet publish XzdAiChatWinUI/XzdAiChatWinUI.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -p:WindowsPackageType=None -o publish 2>&1 | Out-String -Stream | Write-Host
          Write-Host "Exit code: $LASTEXITCODE"
          if (Test-Path publish/XzdAiChat.exe) {
            Compress-Archive -Path publish\* -DestinationPath XzdAiChat-win-x64.zip -Force
          } else {
            Write-Host "No exe produced"
            exit 1
          }

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XzdAiChat-win-x64
          path: XzdAiChat-win-x64.zip
